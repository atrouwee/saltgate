[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silbersalz-look"
version = "0.1.0"
description = "Community reverse-engineering of the SILBERSALZ35 film-lab color grade: LUT fitting and batch application for flat scans."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "pillow-jxl-plugin",
    "opencv-python-headless",
    "tifffile",
]

[project.scripts]
sslook = "silbersalz_look.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
