[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saltgate"
version = "0.1.1"
description = "SALTGATE: open tools for finishing flat SILBERSALZ scans and preserving a colour workflow photographers love (LUTs, batch grading, pair fitting)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "opencv-python-headless",
    "tifffile",
    "imagecodecs",
]

[project.optional-dependencies]
rotate = ["torch", "torchvision"]          # content-based auto-rotation (ResNet probe)
fit = ["scikit-learn", "torch", "open_clip_torch"]   # situation classifier / CLIP suggestions for labeling
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/atrouwee/saltgate"

[project.scripts]
sslook = "silbersalz_look.cli:main"
saltgate = "silbersalz_look.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silbersalz_look = ["models/*.onnx", "models/*.pkl", "luts/*.cube", "luts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running validation (run with -m slow)"]
addopts = "-m 'not slow'"
